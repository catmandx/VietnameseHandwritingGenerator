server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml font/ttf font/otf application/font-woff;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static Routing
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Font files CORS & Caching
    location ~* \.(?:ttf|otf|woff|woff2|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Static Assets Long-term Caching
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # JSON Data Caching
    location ~* \.json$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # HTML No-cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
